# Responde a mencoes de @claude em issues e pull requests.
#
# Conteudo baseado na documentacao oficial do Claude Code (github-actions),
# com os pinos atuais: actions/checkout@v6 e anthropics/claude-code-action@v1.
#
# FALTAM DOIS PASSOS, feitos no site do GitHub, nao aqui. Ambos exigem ADMIN:
#   1. Instalar o app do Claude: https://github.com/apps/claude
#   2. Cadastrar o segredo CLAUDE_CODE_OAUTH_TOKEN em
#      Settings > Secrets and variables > Actions. Gere o valor com:
#        claude setup-token
#      Esse token autentica pela assinatura, entao os runs NAO geram cobranca
#      separada de API. Para usar chave de API, troque a linha
#      claude_code_oauth_token abaixo por:
#        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
name: Claude Code

on:
  # Comentario em issue ou em review de pull request.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Issue recem-aberta: permite disparar sem precisar comentar depois, que e o
  # que torna possivel um e-mail virar ordem de servico automaticamente.
  issues:
    types: [opened]

jobs:
  claude:
    # Cada evento guarda o texto num lugar diferente: comentario em
    # event.comment.body, issue aberta em event.issue.body/title. Testar so o
    # primeiro faria a issue recem-aberta disparar e nunca casar a condicao.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # exigido pela autenticacao padrao via GitHub App
      actions: read     # deixa o Claude ler resultado de CI nos PRs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
